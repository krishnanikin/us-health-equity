[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "us_health_equity"
version = "0.0.1"
description = "Vaccination (MMR, flu), major-disease mortality by race, household income and college attainment, and healthcare spending trends in the US, 2015-present."
authors = [
  { name = "Krishna Desikan" },
]
license = { file = "LICENSE" }
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License"
]
requires-python = "~=3.11.0"


[tool.ruff]
line-length = 99
src = ["us_health_equity"]
include = ["pyproject.toml", "us_health_equity/**/*.py", "dashboard/**/*.py", "tests/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["us_health_equity"]
force-sort-within-sections = true

